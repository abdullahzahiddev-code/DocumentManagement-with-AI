{% extends "base_auth.html" %}
{% block title %}Register — DocuVault AI{% endblock %}
{% block content %}
<h2 class="auth-title">Create account</h2>
<p class="auth-subtitle">Join DocuVault AI today</p>
<form id="registerForm" novalidate>
  <div class="grid-2">
    <div class="form-group">
      <label class="form-label">First Name</label>
      <input type="text" id="first_name" class="form-control" placeholder="First name">
      <div class="form-error" id="first_nameError"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Last Name</label>
      <input type="text" id="last_name" class="form-control" placeholder="Last name">
      <div class="form-error" id="last_nameError"></div>
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">Username <span class="required">*</span></label>
    <input type="text" id="reg_username" class="form-control" placeholder="Choose a username">
    <div class="form-error" id="reg_usernameError"></div>
  </div>
  <div class="form-group">
    <label class="form-label">Email <span class="required">*</span></label>
    <input type="email" id="email" class="form-control" placeholder="your@email.com">
    <div class="form-error" id="emailError"></div>
  </div>
  <div class="form-group">
    <label class="form-label">Password <span class="required">*</span></label>
    <input type="password" id="reg_password" class="form-control" placeholder="At least 8 characters">
    <div class="form-error" id="reg_passwordError"></div>
  </div>
  <div class="form-group">
    <label class="form-label">Confirm Password <span class="required">*</span></label>
    <input type="password" id="reg_password2" class="form-control" placeholder="Repeat password">
    <div class="form-error" id="reg_password2Error"></div>
  </div>
  <div class="form-error" id="generalError" style="margin-bottom:12px"></div>
  <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
    <i class="fa-solid fa-user-plus"></i> Create Account
  </button>
</form>
<div class="auth-footer">Already have an account? <a href="/login/">Sign in</a></div>
{% endblock %}
{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (API.getToken()) { window.location.href = '/dashboard/'; return; }

  document.getElementById('registerForm').addEventListener('submit', async e => {
    e.preventDefault();
    clearFormErrors(document.getElementById('registerForm'));
    const payload = {
      username:   document.getElementById('reg_username').value.trim(),
      email:      document.getElementById('email').value.trim(),
      password:   document.getElementById('reg_password').value,
      password2:  document.getElementById('reg_password2').value,
      first_name: document.getElementById('first_name').value.trim(),
      last_name:  document.getElementById('last_name').value.trim(),
    };
    if (!payload.username)              { showFormError('reg_username', 'Username required.'); return; }
    if (!payload.email)                 { showFormError('email', 'Email required.'); return; }
    if (payload.password.length < 8)    { showFormError('reg_password', 'Minimum 8 characters.'); return; }
    if (payload.password !== payload.password2) { showFormError('reg_password2', 'Passwords do not match.'); return; }

    const btn = document.getElementById('registerBtn');
    setLoading(btn, true, 'Creating account…');
    const result = await API.register(payload);
    setLoading(btn, false);

    if (result && result.ok) {
      API.setTokens(result.data.tokens.access, result.data.tokens.refresh);
      localStorage.setItem('current_user', JSON.stringify(result.data.user));
      Toast.success('Account created!', 'Welcome to DocuVault AI');
      setTimeout(() => window.location.href = '/dashboard/', 700);
    } else {
      const errs = result?.data || {};
      const fieldMap = { username:'reg_username', password:'reg_password', password2:'reg_password2' };
      let shown = false;
      Object.entries(errs).forEach(([f, msgs]) => {
        const id = fieldMap[f] || f;
        const msg = Array.isArray(msgs) ? msgs.join(' ') : String(msgs);
        const el = document.getElementById(id + 'Error');
        if (el) { el.textContent = msg; el.classList.add('visible'); shown = true; }
      });
      if (!shown) {
        const g = document.getElementById('generalError');
        g.textContent = 'Registration failed. Please try again.';
        g.classList.add('visible');
      }
    }
  });
});
</script>
{% endblock %}
