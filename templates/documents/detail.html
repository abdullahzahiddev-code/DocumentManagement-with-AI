{% extends "base.html" %}
{% block title %}Document — DocuVault AI{% endblock %}
{% block nav_documents %}active{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-header-row">
    <a href="/documents/" class="btn btn-ghost btn-sm"><i class="fa-solid fa-arrow-left"></i> Back to Library</a>
    <div class="flex gap-2" id="docActions"></div>
  </div>
</div>

<div id="detailWrap">
  <div class="loading-overlay"><div class="spinner"></div><span class="loading-text">Loading document…</span></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const docId = window.location.pathname.replace(/\/+$/, '').split('/').pop();
let docData = null;

document.addEventListener('DOMContentLoaded', async () => {
  if (!requireAuth()) return;
  await loadDoc();
});

async function loadDoc() {
  const r = await API.getDocument(docId);
  if (!r || !r.ok) {
    document.getElementById('detailWrap').innerHTML =
      '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><h3>Not found</h3><p>This document may be deleted or you lack access.</p><a href="/documents/" class="btn btn-primary">Back to Library</a></div>';
    return;
  }
  docData = r.data;
  renderDoc(docData);
  if (['pending','processing'].includes(docData.processing_status)) pollStatus();
}

function renderDoc(doc) {
  const cu = JSON.parse(localStorage.getItem('current_user') || '{}');
  const isOwner = cu.username === doc.owner?.username;
  const isAdmin = cu.role === 'admin';

  document.getElementById('docActions').innerHTML = `
    <button class="btn btn-secondary btn-sm" onclick="dlDoc()"><i class="fa-solid fa-download"></i> Download</button>
    ${isOwner||isAdmin ? `<button class="btn btn-secondary btn-sm" onclick="reprocess()"><i class="fa-solid fa-rotate"></i> Reprocess</button>` : ''}
    ${isOwner||isAdmin ? `<button class="btn btn-danger btn-sm" onclick="delDoc()"><i class="fa-solid fa-trash"></i> Delete</button>` : ''}`;

  document.getElementById('detailWrap').innerHTML = `
    <div class="detail-layout">
      <!-- Main column -->
      <div>
        <!-- Header card -->
        <div class="card mb-4">
          <div class="card-body">
            <div style="display:flex;gap:16px;align-items:flex-start;margin-bottom:16px">
              <div class="file-icon ${fileIconClass(doc.file_type)}" style="width:52px;height:52px;font-size:1rem;flex-shrink:0">${fileIconLabel(doc.file_type)}</div>
              <div style="flex:1">
                <h2 style="font-size:1.25rem;font-weight:700;margin-bottom:8px">${escHtml(doc.title)}</h2>
                <div class="flex gap-2" style="flex-wrap:wrap">
                  ${statusBadge(doc.processing_status)}
                  ${doc.category?`<span class="badge badge-secondary">${escHtml(doc.category.name)}</span>`:''}
                  <span class="badge badge-secondary">${(doc.file_type||'').toUpperCase()}</span>
                  ${doc.access_level?`<span class="badge badge-secondary"><i class="fa-solid fa-lock" style="font-size:.6rem"></i> ${doc.access_level}</span>`:''}
                </div>
              </div>
            </div>
            ${doc.description?`<p style="color:var(--text-secondary);font-size:.88rem;line-height:1.6;margin-bottom:12px">${escHtml(doc.description)}</p>`:''}
            ${doc.tags&&doc.tags.length?`<div class="tag-list">${doc.tags.map(t=>`<span class="tag-chip">${escHtml(t.name)}</span>`).join('')}</div>`:''}
          </div>
        </div>

        <!-- AI Summary card -->
        <div class="card mb-4">
          <div class="card-header">
            <span class="card-title"><i class="fa-solid fa-wand-magic-sparkles" style="color:#7C3AED"></i> AI Summary</span>
            <div class="flex gap-2">
              <button class="btn btn-secondary btn-sm" id="genTagsBtn" onclick="genTags()"><i class="fa-solid fa-tags"></i> Auto-tag</button>
              <button class="btn btn-primary btn-sm" id="summarizeBtn" onclick="doSummarize()"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate</button>
            </div>
          </div>
          <div class="card-body" id="summaryBody">
            ${doc.summary ? renderSummary(doc.summary) : '<div class="empty-state" style="padding:24px 0"><i class="fa-solid fa-wand-magic-sparkles"></i><p>No summary yet. Click Generate to create one.</p></div>'}
          </div>
        </div>

        <!-- Extracted text -->
        <div class="card">
          <div class="card-header">
            <span class="card-title"><i class="fa-solid fa-file-lines" style="color:var(--primary)"></i> Extracted Text</span>
            <span class="text-muted text-sm">${doc.extracted_text ? doc.extracted_text.length.toLocaleString() + ' chars' : ''}</span>
          </div>
          ${doc.extracted_text
            ? `<div class="text-preview" style="border-radius:0 0 var(--radius) var(--radius)">${escHtml(doc.extracted_text.slice(0,5000))}${doc.extracted_text.length>5000?'\n\n[...truncated for display...]':''}</div>`
            : `<div class="card-body"><div class="empty-state" style="padding:24px 0"><i class="fa-solid fa-file-slash"></i><p>${doc.processing_status==='failed'?'Processing failed: '+escHtml(doc.processing_error):'Text will appear here after processing.'}</p></div></div>`}
        </div>
      </div>

      <!-- Sidebar -->
      <div>
        <div class="card mb-4">
          <div class="card-header"><span class="card-title">Document Info</span></div>
          <div class="card-body" style="display:flex;flex-direction:column;gap:14px">
            <div><div class="text-muted text-sm">Owner</div><div style="font-weight:600">${escHtml(doc.owner?.username||'—')}</div></div>
            <div><div class="text-muted text-sm">Upload Date</div><div style="font-weight:600">${formatDate(doc.upload_date)}</div></div>
            <div><div class="text-muted text-sm">Last Updated</div><div style="font-weight:600">${formatDate(doc.updated_at)}</div></div>
            <div><div class="text-muted text-sm">File Size</div><div style="font-weight:600">${doc.file_size_display||'—'}</div></div>
            <div><div class="text-muted text-sm">File Type</div><div style="font-weight:600">${(doc.file_type||'').toUpperCase()}</div></div>
            <div><div class="text-muted text-sm">Processing</div><div id="statusBadgeEl">${statusBadge(doc.processing_status)}</div></div>
            ${doc.processing_error?`<div><div class="text-muted text-sm">Error</div><div style="color:var(--danger);font-size:.82rem">${escHtml(doc.processing_error)}</div></div>`:''}
          </div>
        </div>

        <div class="card">
          <div class="card-header"><span class="card-title">Quick Actions</span></div>
          <div class="card-body" style="display:flex;flex-direction:column;gap:8px">
            <button class="btn btn-secondary btn-block" onclick="dlDoc()"><i class="fa-solid fa-download"></i> Download File</button>
            <a href="/search/?q=${encodeURIComponent(doc.title)}" class="btn btn-secondary btn-block"><i class="fa-solid fa-magnifying-glass"></i> Find Similar</a>
            ${isOwner||isAdmin?`<button class="btn btn-secondary btn-block" onclick="reprocess()"><i class="fa-solid fa-rotate"></i> Reprocess</button>`:''}
            ${isOwner||isAdmin?`<button class="btn btn-danger btn-block" onclick="delDoc()"><i class="fa-solid fa-trash"></i> Delete</button>`:''}
          </div>
        </div>
      </div>
    </div>`;
}

function renderSummary(s) {
  return `
    <div class="flex gap-2 mb-4" style="flex-wrap:wrap;align-items:center">
      ${s.is_ai_generated
        ? `<span class="ai-badge"><i class="fa-solid fa-robot"></i> AI Generated (${escHtml(s.model_used||'LLM')})</span>`
        : `<span class="fallback-badge"><i class="fa-solid fa-triangle-exclamation"></i> Extractive Fallback</span>`}
      <span class="text-muted text-sm">${s.generated_at?formatDate(s.generated_at):''}</span>
    </div>
    <p class="summary-text mb-4">${escHtml(s.summary_text)}</p>
    ${s.key_points&&s.key_points.length?`<h4 style="font-size:.82rem;font-weight:700;margin-bottom:8px;color:var(--text-secondary);text-transform:uppercase">Key Points</h4>
    <ul class="key-points mb-4">${s.key_points.map(p=>`<li>${escHtml(p)}</li>`).join('')}</ul>`:''}
    ${s.suggested_tags&&s.suggested_tags.length?`<div><h4 style="font-size:.82rem;font-weight:700;margin-bottom:6px;color:var(--text-secondary);text-transform:uppercase">Suggested Tags</h4>
    <div class="tag-list">${s.suggested_tags.map(t=>`<span class="tag-chip">${escHtml(t)}</span>`).join('')}</div></div>`:''}
    ${s.suggested_category?`<div class="mt-3 text-sm text-muted">Suggested category: <strong>${escHtml(s.suggested_category)}</strong></div>`:''}`;
}

async function doSummarize(force = false) {
  if (docData?.summary && !force) {
    Confirm.show('Regenerate Summary', 'Replace the existing summary?', () => doSummarize(true), false);
    return;
  }
  const btn = document.getElementById('summarizeBtn');
  setLoading(btn, true, 'Generating…');
  const r = await API.summarize(docId, force);
  setLoading(btn, false);
  if (r && r.ok && r.data.summary) {
    document.getElementById('summaryBody').innerHTML = renderSummary(r.data.summary);
    if (!r.data.is_ai_generated && r.data.fallback_reason) {
      Toast.warning('Fallback summary', r.data.fallback_reason);
    } else {
      Toast.success('Summary generated!', r.data.is_ai_generated ? 'AI summary created.' : 'Extractive summary created.');
    }
  } else {
    Toast.error('Failed', r?.data?.error || 'Could not generate summary.');
  }
}

async function genTags() {
  const btn = document.getElementById('genTagsBtn');
  setLoading(btn, true, 'Tagging…');
  const r = await API.generateTags(docId);
  setLoading(btn, false);
  if (r && r.ok) { Toast.success('Tags applied!', `${r.data.suggested_tags?.length||0} tags added.`); await loadDoc(); }
  else Toast.error('Failed', r?.data?.error || 'Could not generate tags.');
}

async function dlDoc() {
  Toast.info('Downloading…', '');
  const res = await API.downloadDocument(docId);
  if (!res || !res.ok) { Toast.error('Download failed', ''); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = docData?.filename || 'document'; a.click();
  URL.revokeObjectURL(url);
}

async function reprocess() {
  const r = await API.processDocument(docId);
  if (r && r.ok) { Toast.success('Reprocessing started', ''); pollStatus(); }
  else Toast.error('Failed', r?.data?.error || '');
}

async function delDoc() {
  Confirm.show('Delete Document', `Delete "${docData?.title}"? This cannot be undone.`, async () => {
    const r = await API.deleteDocument(docId);
    if (r.ok) { Toast.success('Deleted', ''); setTimeout(() => window.location.href = '/documents/', 600); }
    else Toast.error('Delete failed', '');
  });
}

function pollStatus() {
  const iv = setInterval(async () => {
    const r = await API.getDocumentStatus(docId);
    if (!r || !r.ok) { clearInterval(iv); return; }
    const st = r.data.processing_status;
    const el = document.getElementById('statusBadgeEl');
    if (el) el.innerHTML = statusBadge(st);
    if (['completed','failed'].includes(st)) {
      clearInterval(iv);
      if (st === 'completed') { Toast.success('Processing complete!', 'Text extracted.'); await loadDoc(); }
      else Toast.error('Processing failed', r.data.processing_error || '');
    }
  }, 3000);
}
</script>
{% endblock %}
